        @media(max-width:600px) {

<body>


<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        🛍️ ShopEasy
    </div>

    <button
        class="cart-button"
        onclick="showCart()">

        🛒 Cart
        (<span id="cartCount">0</span>)

    </button>

</header>


<!-- ================= HOME PAGE ================= -->

<div id="homePage">

    <section class="hero">

        <h1>
            Welcome to ShopEasy
        </h1>

        <p>
            Your Simple Online Shopping Store
        </p>

    </section>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="search"
            placeholder="🔍 Search products..."
            onkeyup="searchProducts()">

    </div>


    <!-- PRODUCTS -->

    <div class="container">

        <h2 class="title">
            🛍️ Our Products
        </h2>

        <div
            class="products"
            id="productList">
        </div>

    </div>

</div>


<!-- ================= CART PAGE ================= -->

<div id="cartPage">

    <div class="cart-box">

        <h2>
            🛒 Shopping Cart
        </h2>

        <br>

        <div id="cartItems"></div>

        <div class="total">

            Total: ₹
            <span id="cartTotal">
                0
            </span>

        </div>

        <button
            class="checkout-button"
            onclick="showCheckout()">

            Proceed to Checkout

        </button>

        <button
            class="back-button"
            onclick="showHome()">

            Continue Shopping

        </button>

    </div>

</div>


<!-- ================= CHECKOUT PAGE ================= -->

<div id="checkoutPage">

    <div class="checkout-box">

        <h2>
            📦 Checkout
        </h2>


        <label>
            Full Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name">


        <label>
            Phone Number
        </label>

        <input
            type="text"
            id="phone"
            placeholder="Enter phone number">


        <label>
            Delivery Address
        </label>

        <textarea
            id="address"
            rows="4"
            placeholder="Enter your address">
        </textarea>


        <label>
            Payment Method
        </label>

        <select id="payment">

            <option>
                Cash on Delivery
            </option>

            <option>
                UPI
            </option>

            <option>
                Credit / Debit Card
            </option>

        </select>


        <h3 style="margin-top:20px">

            Order Total: ₹
            <span id="checkoutTotal">
                0
            </span>

        </h3>


        <button
            class="place-order"
            onclick="placeOrder()">

            ✅ Place Order

        </button>


        <button
            class="back-button"
            onclick="showCart()">

            ← Back to Cart

        </button>

    </div>

</div>


<!-- ================= FOOTER ================= -->

<footer>

    <p>
        © 2026 ShopEasy
    </p>

    <p>
        Simple E-Commerce College Project
    </p>

</footer>


<script>


/* =========================================
   PRODUCTS
========================================= */

const products = [

    {
        id: 1,
        name: "Wireless Headphones",
        price: 999,
        description: "Bluetooth headphones with clear sound.",
        image:
        "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80"
    },

    {
        id: 2,
        name: "Smart Watch",
        price: 1499,
        description: "Smart watch for fitness and daily use.",
        image:
        "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80"
    },

    {
        id: 3,
        name: "Running Shoes",
        price: 1999,
        description: "Comfortable running shoes for everyday use.",
        image:
        "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80"
    },

    {
        id: 4,
        name: "Backpack",
        price: 899,
        description: "Stylish backpack for college and travel.",
        image:
        "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=500&q=80"
    },

    {
        id: 5,
        name: "Digital Camera",
        price: 29999,
        description: "Digital camera for photography.",
        image:
        "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=500&q=80"
    },

    {
        id: 6,
        name: "Laptop",
        price: 54999,
        description: "Laptop for study, coding and entertainment.",
        image:
        "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=500&q=80"
    }

];


/* =========================================
   CART
========================================= */

let cart = [];


/* =========================================
   DISPLAY PRODUCTS
========================================= */

function displayProducts(productArray) {

    const list =
        document.getElementById("productList");

    list.innerHTML = "";


    if (productArray.length === 0) {

        list.innerHTML =
        "<h3>No products found.</h3>";

        return;
    }


    productArray.forEach(function(product) {

        list.innerHTML += `

            <div class="product">

                <img
                    src="${product.image}"
                    alt="${product.name}">

                <div class="product-info">

                    <h3>
                        ${product.name}
                    </h3>

                    <p class="description">
                        ${product.description}
                    </p>

                    <p class="price">
                        ₹${product.price.toLocaleString()}
                    </p>

                    <button
                        class="add-button"
                        onclick="addToCart(${product.id})">

                        🛒 Add to Cart

                    </button>

                    <button
                        class="details-button"
                        onclick="showDetails(${product.id})">

                        👁️ View Details

                    </button>

                </div>

            </div>

        `;

    });

}


/* =========================================
   SEARCH
========================================= */

function searchProducts() {

    const text =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    const result =
        products.filter(function(product) {

            return product.name
                .toLowerCase()
                .includes(text);

        });


    displayProducts(result);

}


/* =========================================
   ADD TO CART
========================================= */

function addToCart(id) {

    const product =
        products.find(function(product) {

            return product.id === id;

        });


    const existing =
        cart.find(function(item) {

            return item.id === id;

        });


    if (existing) {

        existing.quantity++;

    }

    else {

        cart.push({

            id: product.id,
            name: product.name,
            price: product.price,
            image: product.image,
            quantity: 1

        });

    }


    updateCartCount();

    alert(
        product.name +
        " added to cart!"
    );

}


/* =========================================
   CART COUNT
========================================= */

function updateCartCount() {

    let count = 0;


    cart.forEach(function(item) {

        count += item.quantity;

    });


    document.getElementById("cartCount")
        .innerText = count;

}


/* =========================================
   SHOW CART
========================================= */

function showCart() {

    document.getElementById("homePage")
        .style.display = "none";

    document.getElementById("cartPage")
        .style.display = "block";

    document.getElementById("checkoutPage")
        .style.display = "none";


    displayCart();

}


/* =========================================
   DISPLAY CART
========================================= */

function displayCart() {

    const cartItems =
        document.getElementById("cartItems");


    cartItems.innerHTML = "";


    if (cart.length === 0) {

        cartItems.innerHTML =
        "<h3>Your cart is empty 🛒</h3>";

        document.getElementById("cartTotal")
            .innerText = "0";

        return;
    }


    let total = 0;


    cart.forEach(function(item) {

        total +=
        item.price * item.quantity;


        cartItems.innerHTML += `

            <div class="cart-item">

                <img
                    src="${item.image}"
                    alt="${item.name}">


                <div>

                    <b>
                        ${item.name}
                    </b>

                    <p>
                        ₹${item.price.toLocaleString()}
                    </p>

                </div>


                <div class="quantity">

                    <button
                        onclick="changeQuantity(${item.id}, -1)">

                        −

                    </button>


                    ${item.quantity}


                    <button
                        onclick="changeQuantity(${item.id}, 1)">

                        +

                    </button>

                </div>


                <button
                    onclick="removeItem(${item.id})">

                    ❌

                </button>

            </div>

        `;

    });


    document.getElementById("cartTotal")
        .innerText =
        total.toLocaleString();

}


/* =========================================
   CHANGE QUANTITY
========================================= */

function changeQuantity(id, change) {

    const item =
        cart.find(function(item) {

            return item.id === id;

        });


    item.quantity += change;


    if (item.quantity <= 0) {

        removeItem(id);

        return;

    }


    updateCartCount();

    displayCart();

}


/* =========================================
   REMOVE ITEM
========================================= */

function removeItem(id) {

    cart =
        cart.filter(function(item) {

            return item.id !== id;

        });


    updateCartCount();

    displayCart();

}


/* =========================================
   PRODUCT DETAILS
========================================= */

function showDetails(id) {

    const product =
        products.find(function(product) {

            return product.id === id;

        });


    alert(

        "PRODUCT DETAILS\n\n" +

        "Product: " +
        product.name +

        "\n\nDescription: " +
        product.description +

        "\n\nPrice: ₹" +
        product.price

    );

}


/* =========================================
   CHECKOUT
========================================= */

function showCheckout() {

    if (cart.length === 0) {

        alert(
            "Your cart is empty!"
        );

        return;
    }


    document.getElementById("cartPage")
        .style.display = "none";

    document.getElementById("checkoutPage")
        .style.display = "block";


    let total = 0;


    cart.forEach(function(item) {

        total +=
        item.price * item.quantity;

    });


    document.getElementById("checkoutTotal")
        .innerText =
        total.toLocaleString();

}


/* =========================================
   PLACE ORDER
========================================= */

function placeOrder() {

    const name =
        document.getElementById("name")
        .value.trim();


    const phone =
        document.getElementById("phone")
        .value.trim();


    const address =
        document.getElementById("address")
        .value.trim();


    if (
        name === "" ||
        phone === "" ||
        address === ""
    ) {

        alert(
            "Please fill all the details."
        );

        return;
    }


    alert(

        "🎉 ORDER PLACED SUCCESSFULLY!\n\n" +

        "Thank you, " +
        name +
        "!\n\n" +

        "Your order will be delivered soon."

    );


    cart = [];

    updateCartCount();

    showHome();

}


/* =========================================
   SHOW HOME
========================================= */

function showHome() {

    document.getElementById("homePage")
        .style.display = "block";

    document.getElementById("cartPage")
        .style.display = "none";

    document.getElementById("checkoutPage")
        .style.display = "none";

}


/* =========================================
   START WEBSITE
========================================= */

displayProducts(products);

</script>

</body>

</html>
```
